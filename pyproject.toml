[project]
name = "slack-machine-livetennis"
version = "0.1.0"
description = "Live tennis scores, rankings and fixtures for Slack, powered by the Live Tennis API — a slack-machine plugin"
readme = "README.md"
license = { text = "MIT" }
requires-python = "<4.0,>=3.9"
authors = [
    { name = "Live Tennis API", email = "hello@livetennisapi.com" },
]
keywords = ["slack", "slack-machine", "tennis", "live-scores", "bot", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "slack-machine>=0.40.0",
    "httpx>=0.24",
]

[project.urls]
Homepage = "https://livetennisapi.com"
Source = "https://github.com/livetennisapi/slack-machine-livetennis"
"Free API key" = "https://livetennisapi.com/subscribe/free"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sm_livetennis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
